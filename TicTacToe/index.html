<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Tic Tac Toe</h1>

    <!-- Message container for player turns and win announcements -->
    <div id="message"></div>

    <!-- Board container where JS dynamically creates grid squares -->
    <div id="gameboard" class="board"></div>

    <!-- Restart button -->
    <button id="restart-btn">Restart Game</button>

    <script src="script.js"></script>
  </body>
</html>
