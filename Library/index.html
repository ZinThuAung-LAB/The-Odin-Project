<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Library</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1>My Library</h1>
          <p class="subtitle">Track and manage your reading list</p>
        </div>
        <button id="add-book-btn" class="add-btn">+ Add New Book</button>
      </header>
    </div>
    <div class="books-grid"></div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2>Add New Book</h2>
          <button class="close-btn" id="close-modal-btn">&times;</button>
        </div>

        <!-- Added novalidate to bypass default browser popups -->
        <form id="add-book-form" novalidate>
          <div class="form-group">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              required
              placeholder="e.g. The Hobbit"
            />
            <span class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="author">Author</label>
            <input
              type="text"
              id="author"
              required
              placeholder="e.g. J.R.R. Tolkien"
            />
            <span class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="pages">Pages</label>
            <input
              type="number"
              id="pages"
              min="1"
              required
              placeholder="e.g. 295"
            />
            <span class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="is-read" />
            <label for="is-read">Have you read this book?</label>
          </div>

          <button type="submit" class="submit-btn">Add Book</button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
