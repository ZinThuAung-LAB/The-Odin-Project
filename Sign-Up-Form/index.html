<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sign Up Form</title>
  </head>
  <body>
    <div class="container">
      <div class="side-bar">
        <div class="background"></div>
        <div class="logo"></div>
      </div>
      <main>
        <article class="description">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p>Sign up now to get started.</p>
          <p>You know you want to.</p>
        </article>
        <form action="" method="get">
          <label for="first-name" name="first-name">FIRST NAME</label>
          <input type="text" name="first-name" id="first-name" />

          <label for="last-name" name="last-name">LAST NAME</label>
          <input type="text" name="last-name" id="last-name" />

          <label for="email" name="email">EMAIL</label>
          <input type="email" name="email" id="email" />

          <label for="ph-no" name="ph-no">PHONE NUMBER</label>
          <input type="number" name="ph-no" id="ph-no" />

          <label for="password" name="password">PASSWORD</label>
          <input type="password" name="password" id="password" />

          <label for="confirm-pass" name="confirm-pass">CONFIRM PASSWORD</label>
          <input type="password" name="confirm-pass" id="confirm-pass" />
        </form>
        <footer>
          <button class="submit" type="submit">Create Account</button>
          <p>Already have an account? <a>Log in</a></p>
        </footer>
      </main>
    </div>
  </body>
</html>
