<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Sign Up Form</title>
  </head>
  <body>
    <div class="container">
      <div class="side-bar">
        <div class="logo">
          <img src="./images/odin-logo.png" alt="logo" class="logo-image">
          <span class="logo-text">ODIN</span>
        </div>
        <div class="credit">
          Photo by <a href="https://unsplash.com/@haliewestphoto">Hailey West</a> on <a href="https://unsplash.com">Unsplash</a></p>
        </div>
      </div>
      <div class="main-content">
        <header class="header-text">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p>Sign up <em>now</em> to get started.</p>
          <p class="cta-text">You <em>know</em> you want to.</p>
        </header>
        <main class="form-container">
          <h2>Let's do this!</h2>
          <form action="#" method="POST" id="signup-form">
          <div class="form-row">
            <div class="input-group">
              <label for="first-name">FIRST NAME</label>
              <input type="text" name="first-name" id="first-name" value="Thor" required/>
            </div>
            <div class="input-group">
              <label for="last-name" name="last-name">LAST NAME</label>
              <input type="text" name="last-name" id="last-name" value="Odinson" required />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="email">EMAIL</label>
              <input type="email" name="email" id="email" required/>
            </div>
            <div class="input-group">
              <label for="phone">PHONE NUMBER</label>
              <input type="tel" name="phone" id="phone" required/>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="password">PASSWORD</label>
              <input type="password" name="password" id="password"  class="error" required/>
            </div>
            <div class="input-group">
              <label for="confirm-pass"">CONFIRM PASSWORD</label>
              <input type="password" name="confirm-pass" id="confirm-pass" class="error" required />
            </div>
          </div>
        </form>
        </main>
        
        <footer class="action-section">
          <button class="btn" type="submit" form="signup-form">Create Account</button>
          <p class="login-prompt">Already have an account? <a>Log in</a></p>
        </footer>
      </div>
    </div>
  </body>
</html>
